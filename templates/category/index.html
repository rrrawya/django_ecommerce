{% extends "base.html" %}
{% block content %}

<div style="background-color: #f8f8f8; padding: 80px 0; text-align: center; position: relative; overflow: hidden;">
    <h1 style="font-size: 10vw; opacity: 0.05; font-weight: 900; margin: 0; position: absolute; width: 100%; top: 50%; left: 50%; transform: translate(-50%, -50%); white-space: nowrap; pointer-events: none;">
        YOUR CHOICE
    </h1>
    <div class="position-relative">
        <h2 class="fw-bold display-5" style="color: #333; letter-spacing: 2px;">NEW ARRIVALS</h2>
    </div>
</div>

<div class="container py-5">
    <div class="row justify-content-center g-4">
        {% for product in products %}
        <div class="col-lg-4 col-md-6">
            <div class="card h-100 border-0 shadow-sm" style="border-radius: 40px; background-color: #f8c5c8; overflow: hidden; transition: 0.3s;">
                
                <div class="bg-white p-4 text-center" style="border-radius: 0 0 50px 50px; height: 250px; display: flex; align-items: center; justify-content: center;">
                    {% if product.image %}
                        <img src="{{ product.image.url }}" class="img-fluid" style="max-height: 100%; object-fit: contain;">
                    {% endif %}
                </div>

                <div class="card-body text-center p-4">
                    <h5 class="fw-bold mb-1" style="color: #444;">{{ product.name }}</h5>
                    <p class="mb-3" style="color: #d81b60; font-weight: bold; font-size: 1.1rem;">{{ product.price|floatformat:0 }} SAR</p>
                    <a href="{% url 'details' product.id %}" class="btn btn-dark rounded-pill px-4" style="font-size: 0.85rem;">Learn more</a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center py-5">
            <p class="text-muted">لا توجد منتجات حالياً.</p>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
